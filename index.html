<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">

    <h2 class="text-center mb-4">Random User Generator</h2>

    <div class="card p-4 shadow mb-4">
        <label class="form-label">Number of Users</label>

        <input type="number" id="userCount" class="form-control mb-3"
               value="1" min="1" max="50">

        <button class="btn btn-primary" id="generateBtn" onclick="getUsers()">
            Generate Users
        </button>
    </div>

    <p id="message" class="text-center"></p>

    <div class="row" id="userContainer"></div>

</div>

<script src="script.js"></script>
</body>
</html>
